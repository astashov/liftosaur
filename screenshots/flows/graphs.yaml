appId: ${APP_ID}
---
- runFlow: lib/login.yaml
- tapOn:
    id: footer-graphs
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: dashboard-graph
    timeout: 10000
- takeScreenshot: graphs-dashboard
- longPressOn:
    id: dashboard-graph
- takeScreenshot: graphs-cursor
- tapOn:
    text: "Strength ▾"
- extendedWaitUntil:
    visible:
      id: dashboards-new
    timeout: 5000
- takeScreenshot: graphs-dashboards
- tapOn:
    id: dashboards-select-strength
- waitForAnimationToEnd
- tapOn:
    id: dashboard-edit
- extendedWaitUntil:
    visible:
      id: dashboard-edit-view
    timeout: 10000
- takeScreenshot: graphs-edit
- tapOn:
    id: dashboard-edit-menu-2
- waitForAnimationToEnd
- takeScreenshot: graphs-tile-menu
- tapOn:
    id: dashboard-edit-menu-edit
- extendedWaitUntil:
    visible:
      id: dashboard-widget-series-0
    timeout: 5000
- takeScreenshot: graphs-widget
- tapOn:
    id: dashboard-widget-series-0
- waitForAnimationToEnd
- takeScreenshot: graphs-series
- tapOn:
    text: "Cancel"
- waitForAnimationToEnd
- tapOn:
    id: dashboard-edit-mode-text
- waitForAnimationToEnd
- takeScreenshot: graphs-text
- tapOn:
    id: navbar-back
- waitForAnimationToEnd
- tapOn:
    id: footer-me
- scrollUntilVisible:
    element:
      id: menu-item-exercises
    direction: DOWN
    centerElement: true
- tapOn:
    id: menu-item-exercises
- scrollUntilVisible:
    element:
      id: menu-item-bench-press
    direction: DOWN
    centerElement: true
- tapOn:
    id: menu-item-bench-press
- scrollUntilVisible:
    element:
      id: exercise-stats-pr
    direction: DOWN
    centerElement: true
- takeScreenshot: graphs-personal-records
