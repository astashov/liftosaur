appId: ${APP_ID}
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Get started"
    timeout: 20000
- takeScreenshot: onboarding-and-settings-welcome
- tapOn: "Get started"
- takeScreenshot: onboarding-and-settings-units
- tapOn: "Continue"
- takeScreenshot: onboarding-and-settings-equipment
- runFlow: lib/login.yaml
- tapOn:
    id: footer-me
- takeScreenshot: onboarding-and-settings-me
- scrollUntilVisible:
    element:
      text: "Dark mode"
    direction: DOWN
    centerElement: true
- takeScreenshot: onboarding-and-settings-appearance
- tapOn:
    rightOf:
      text: "Dark mode"
- takeScreenshot: onboarding-and-settings-dark-mode
- tapOn:
    rightOf:
      text: "Dark mode"
